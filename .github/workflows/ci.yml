name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Unit + Frontend tests (Vitest, no emulator needed)
  # ─────────────────────────────────────────────
  unit-and-frontend:
    name: Unit & Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (6 tests)
        run: npm run test:unit

      - name: Run frontend component tests (6 tests)
        run: npm run test:frontend

  # ─────────────────────────────────────────────
  # JOB 2: Fullstack / E2E tests (Playwright + Firebase emulators)
  # ─────────────────────────────────────────────
  e2e:
    name: Fullstack E2E Tests (Playwright + Firebase Emulators)
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: fake-api-key-for-testing
      VITE_FIREBASE_AUTH_DOMAIN: tigercook-7f584.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: tigercook-7f584
      VITE_FIREBASE_STORAGE_BUCKET: tigercook-7f584.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "182463287197"
      VITE_FIREBASE_APP_ID: "1:182463287197:web:9df23f107027cb22cca974"
      VITE_OPENAI_API_KEY: fake-openai-key-for-testing
      VITE_USE_FIREBASE_EMULATOR: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (required by Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firebase emulators
        run: |
          firebase emulators:start \
            --only auth,firestore \
            --project tigercook-7f584 &
          # Wait until both emulator ports are open
          npx wait-on tcp:9099 tcp:8080 --timeout 60000

      - name: Write .env for Vite dev server
        run: |
          cat > .env << 'EOF'
          VITE_FIREBASE_API_KEY=fake-api-key-for-testing
          VITE_FIREBASE_AUTH_DOMAIN=tigercook-7f584.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=tigercook-7f584
          VITE_FIREBASE_STORAGE_BUCKET=tigercook-7f584.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=182463287197
          VITE_FIREBASE_APP_ID=1:182463287197:web:9df23f107027cb22cca974
          VITE_OPENAI_API_KEY=fake-openai-key-for-testing
          VITE_USE_FIREBASE_EMULATOR=true
          EOF

      - name: Run fullstack E2E tests (6 tests)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
